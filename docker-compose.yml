x-api-build: &api-build
  context: .
  target: api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: *api-build
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
    command: ["python", "-m", "migrations", "--adopt-base"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-pix-antifraud}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      PIX_POLICY_FILE: ${PIX_POLICY_FILE:-/app/antifraud/policies.json}
      BANKSLIP_API_URL: ${BANKSLIP_API_URL:-http://localhost:8080}
      BANKSLIP_API_INTERNAL_TOKEN: ${BANKSLIP_API_INTERNAL_TOKEN:-default_token}
      BANKSLIP_API_TIMEOUT: ${BANKSLIP_API_TIMEOUT:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health_check')"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  postgres_data:
