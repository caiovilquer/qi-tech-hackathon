# Standalone stack. No host ports or persistent volumes; never reuse an app DB.
x-api-build: &api-build
  context: .
  target: api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: pix_test_suite
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d pix_test_suite"]
      interval: 1s
      timeout: 3s
      retries: 30

  migrate:
    build: *api-build
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/pix_test_suite
    command: ["python", "-m", "migrations"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    environment:
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/pix_test_suite
      APP_ENV: testing
      INTERNAL_TOKEN: test_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health_check')"]
      interval: 1s
      timeout: 3s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully

  tests:
    build:
      context: .
      target: test
    environment:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/pix_test_suite
      SERVER_LOCALHOST: api
      API_PORT: '3000'
      INTERNAL_TOKEN: test_token
    depends_on:
      api:
        condition: service_healthy
